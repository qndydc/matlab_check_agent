[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-refactor-agent"
version = "0.1.0"
description = "Analyze large MATLAB codebases and prepare safe refactoring plans."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "maxx>=0.8.0,<0.9",
    "networkx>=3.0,<4",
    "numpy>=2.1,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "rich>=13.0,<15",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]

[project.scripts]
matlab-refactor = "matlab_refactor_agent.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["matlab_refactor_agent"]
branch = true
