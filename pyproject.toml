[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-refactor-agent"
version = "0.1.0"
description = "Deterministic MATLAB analysis, semantic pipelines, and a MATLAB-to-Python migration agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=0.2,<2",
    "maxx>=0.8.0,<0.9",
    "networkx>=3.0,<4",
    "numpy>=2.1,<3",
    "openai>=2.0,<3",
    "pydantic>=2.5,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0,<2",
    "rich>=13.0,<15",
    "scipy>=1.14,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]

[project.scripts]
matlab-refactor = "matlab_refactor_agent.interfaces.cli.main:main"
matlab-refactor-web = "matlab_refactor_agent.interfaces.api.main:main"
matlab-semantic-web = "matlab_refactor_agent.apps.semantic.backend.main:main"
matlab-migration-web = "matlab_refactor_agent.apps.migration.backend.main:main"
matlab-combined-web = "matlab_refactor_agent.apps.combined:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["matlab_refactor_agent"]
branch = true
