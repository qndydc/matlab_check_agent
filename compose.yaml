services:
  data-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: matlab-atlas:0.1.0
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - "mkdir -p /data/config /data/graphs /data/jobs && chown -R 10001:10001 /data"
    volumes:
      - type: bind
        source: ${MATLAB_DATA_PATH:-./var/docker-data}
        target: /data

  semantic-app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: matlab-atlas:0.1.0
    container_name: matlab-semantic-app
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    ports:
      - "${MATLAB_BIND_ADDRESS:-0.0.0.0}:${MATLAB_WEB_PORT:-8000}:8000"
    environment:
      MATLAB_REFACTOR_ENV_FILE: /data/config/.env
      MATLAB_PROJECTS_HOST_PATH: ${MATLAB_PROJECTS_PATH:-./projects}
      MATLAB_REFACTOR_INPUT_PATH: /projects
      MATLAB_REFACTOR_GRAPH_OUTPUT_DIR: /data/graphs
      MATLAB_REFACTOR_ARTIFACT_DIR: /data/jobs
      MATLAB_REFACTOR_STATE_DB: /data/refactor-agent.db
      MATLAB_REFACTOR_WEB_DB: /data/web-projects.db
    volumes:
      - type: bind
        source: ${MATLAB_PROJECTS_PATH:-./projects}
        target: /projects
        read_only: true
      - type: bind
        source: ${MATLAB_DATA_PATH:-./var/docker-data}
        target: /data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  migration-app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.migration
    image: matlab-migration:0.1.0
    container_name: matlab-migration-app
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      MATLAB_REFACTOR_ENV_FILE: /data/config/.env
      MATLAB_PROJECTS_HOST_PATH: ${MATLAB_PROJECTS_PATH:-./projects}
      MATLAB_REFACTOR_ARTIFACT_DIR: /data/jobs
      MATLAB_REFACTOR_STATE_DB: /data/refactor-agent.db
      MATLAB_REFACTOR_WEB_DB: /data/web-projects.db
    volumes:
      - type: bind
        source: ${MATLAB_PROJECTS_PATH:-./projects}
        target: /projects
        read_only: true
      - type: bind
        source: ${MATLAB_DATA_PATH:-./var/docker-data}
        target: /data
    ports:
      - "${MATLAB_MIGRATION_BIND_ADDRESS:-0.0.0.0}:${MATLAB_MIGRATION_WEB_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
